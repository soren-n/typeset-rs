name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Quality Gates (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust: stable
            check_fmt: true
            check_clippy: true
          - rust: "1.96.0"
            check_fmt: false
            check_clippy: false
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: ${{ matrix.check_fmt && 'rustfmt, clippy' || '' }}

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.rust }}

    - name: Check formatting
      if: matrix.check_fmt
      run: cargo fmt --all --check

    - name: Run clippy
      if: matrix.check_clippy
      run: cargo clippy --all-targets -- -D warnings

    # Clippy type-checks every target on stable; the MSRV job has no clippy.
    - name: Type checking
      if: ${{ !matrix.check_clippy }}
      run: cargo check --all-targets

    - name: Check doc links
      if: matrix.check_clippy
      run: cargo doc --no-deps

    - name: Run Rust tests
      run: cargo test --all

  oracle:
    name: Oracle (Rust vs OCaml reference)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        key: oracle

    - name: Setup OCaml
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: "5"

    - name: Install OCaml dependencies
      run: opam install --yes typeset.0.4 qcheck dune

    # Builds the OCaml reference tester and oracle and the Rust driver they
    # compare against. `opam exec` puts dune on PATH; cargo comes from the
    # Rust toolchain step.
    - name: Build oracle harness
      run: cd oracle && opam exec -- ./build.sh

    # The renderer is the part most prone to silent divergence, so the
    # primary correctness gate is byte-identity with the reference on
    # generated layouts, biased toward the grp/seq nestings where breaking
    # decisions differ. Three runs, three random seeds.
    - name: Oracle identity suite
      run: |
        cd oracle
        for i in 1 2 3; do opam exec -- ./_build/tester; done

    # The pinned cases' expected blocks must be what the reference renders.
    - name: Pinned cases are current
      run: |
        cd oracle && opam exec -- ./pin.sh
        git diff --exit-code -- ../typeset/tests/oracle.txt
