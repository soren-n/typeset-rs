name: Cargo Deny

# Advisories, the license allow-list in deny.toml, duplicate versions and
# sources: on every change, and weekly so a new advisory against an
# unchanged lockfile still surfaces.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9 AM UTC
  workflow_dispatch:

jobs:
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
