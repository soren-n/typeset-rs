[workspace]
resolver = "2"
members = [
  "typeset",
  "typeset-parser",
  "oracle/driver"
]

[workspace.package]
edition = "2024"
rust-version = "1.96.0"
version = "5.0.0"
authors = ["Soren Norbaek <sorennorbaek@gmail.com>"]
license = "GPL-3.0-or-later"
categories = ["compilers", "template-engine"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
proc-macro2 = "1.0"
quote = "1.0"
typeset = { version = "5.0.0", path = "typeset" }
typeset-parser = { version = "5.0.0", path = "typeset-parser" }
criterion = { version = "0.8", features = ["html_reports"] }
