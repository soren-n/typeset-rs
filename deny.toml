# Configuration for cargo-deny
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
# If true, metadata will be collected with `--all-features`
all-features = true

[output]
feature-depth = 1

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]
# Behaviour for yanked crate versions: "deny" | "warn" | "allow"
yanked = "warn"
# Scope of unmaintained-advisory checks: "all" | "workspace" | "transitive" | "none".
# Unmaintained-only advisories do not fail the check; vulnerabilities do.
unmaintained = "none"
# A list of advisory IDs to ignore.
ignore = []

[licenses]
# Allow-only: anything not listed here is denied. This is exactly the set the
# current dependency graph uses; a new dependency under another permissive
# license fails the check and is added here deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8
# This project is GPL-3.0-or-later. Scope the GPL allowance to the workspace
# crates only; third-party dependencies must stay permissive.
exceptions = [
    { name = "typeset", allow = ["GPL-3.0-or-later"] },
    { name = "typeset-macro", allow = ["GPL-3.0-or-later"] },
    { name = "typeset-oracle-driver", allow = ["GPL-3.0-or-later"] },
]

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is wildcarded
wildcards = "allow"
# Crates to ban entirely
deny = []
# Crates skipped during duplicate detection
skip = []
# Crate trees skipped during duplicate detection
skip-tree = []

[sources]
# Lint level for an unknown crate registry
unknown-registry = "warn"
# Lint level for an unknown git source
unknown-git = "warn"
# Allowed crate registries (crates.io only by default)
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allowed git repositories
allow-git = []
